# ============================================================================
# PRESS YOUR LUCK - Audio Manifest
# ============================================================================
# This manifest defines all audio assets for the game, including file paths,
# volume levels, categories, and fallback behavior.
#
# File Format Priority: OGG Vorbis (.ogg) primary, WAV (.wav) fallback
# Sample Rate: 44,100 Hz
# Channels: Mono for effects, Stereo for music
#
# If an audio file is not found, the system falls back to procedural generation.
# ============================================================================

[meta]
version = "1.0.0"
description = "Press Your Luck Audio Asset Manifest"

# ============================================================================
# THEME MUSIC
# ============================================================================
# Main music tracks used throughout the game
# These are stereo, loopable where indicated

[[theme]]
id = "intro"
file = "theme/intro.ogg"
fallback = "theme/intro.wav"
volume = 0.7
category = "music"
looping = false
description = "Opening theme played at game start"

[[theme]]
id = "board_music"
file = "theme/board_music.ogg"
fallback = "theme/board_music.wav"
volume = 0.5
category = "music"
looping = true
loop_start_ms = 0
loop_end_ms = 8000
description = "Background music during board rounds"

[[theme]]
id = "tension"
file = "theme/tension.ogg"
fallback = "theme/tension.wav"
volume = 0.25
category = "music"
looping = true
loop_start_ms = 0
loop_end_ms = 2000
description = "Tension loop during spin"

[[theme]]
id = "question_theme"
file = "theme/question_theme.ogg"
fallback = "theme/question_theme.wav"
volume = 0.4
category = "music"
looping = true
description = "Background music during question rounds"

[[theme]]
id = "winner"
file = "theme/winner.ogg"
fallback = "theme/winner.wav"
volume = 0.8
category = "music"
looping = false
description = "Victory fanfare at game end"

[[theme]]
id = "closing"
file = "theme/closing.ogg"
fallback = "theme/closing.wav"
volume = 0.6
category = "music"
looping = false
description = "Closing credits theme"

