name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: press-your-luck-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: press-your-luck-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: press-your-luck-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: press-your-luck-windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/press-your-luck dist/
          cp README.md LICENSE dist/
          cd dist && tar -czvf ../${{ matrix.artifact }}.tar.gz *

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/${{ matrix.target }}/release/press-your-luck.exe dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.artifact }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  build-appimage:
    name: Build AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libfuse2
          # Download linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Build release binary
        run: cargo build --release

      - name: Create AppDir structure
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # Copy binary
          cp target/release/press-your-luck AppDir/usr/bin/

          # Create desktop entry
          cat > AppDir/usr/share/applications/press-your-luck.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Press Your Luck
          Comment=Authentic recreation of the 1983-1986 CBS game show
          Exec=press-your-luck
          Icon=press-your-luck
          Categories=Game;
          Terminal=false
          EOF

          # Create a simple icon (SVG converted to PNG would be better, but this works)
          # Using a placeholder - in production you'd want a real icon
          convert -size 256x256 xc:'#1a1a2e' -fill '#ffd700' -gravity center \
            -pointsize 48 -annotate 0 'PYL' AppDir/usr/share/icons/hicolor/256x256/apps/press-your-luck.png || \
          # Fallback: create minimal PNG if imagemagick not available
          echo 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==' | base64 -d > AppDir/usr/share/icons/hicolor/256x256/apps/press-your-luck.png

      - name: Build AppImage
        run: |
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/press-your-luck.desktop \
            --output appimage

          # Rename to include version
          mv Press_Your_Luck*.AppImage press-your-luck-x86_64.AppImage || \
          mv *.AppImage press-your-luck-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: press-your-luck-appimage
          path: press-your-luck-x86_64.AppImage

  create-release:
    name: Create Release
    needs: [build-release, build-appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.AppImage
